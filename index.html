<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kala Sutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260919-safe1">
<style>
#ks-safe-error{display:none;position:fixed;inset:0;z-index:999999;background:#f4eeda;color:#241c1b;padding:22px 16px;font-family:Arial,sans-serif;overflow:auto}
#ks-safe-error .box{max-width:760px;margin:4vh auto;background:#fffaf3;border:1px solid #c9b8a5;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0002}
#ks-safe-error h2{margin:0 0 10px;font-family:Georgia,serif}
#ks-safe-error pre{white-space:pre-wrap;word-break:break-word;background:#f1e7d8;padding:12px;border-radius:10px;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="root"></div>
<div id="ks-safe-error">
  <div class="box">
    <h2>KalaSutra loading error</h2>
    <p>The existing app reported a JavaScript error. Your app files were not changed.</p>
    <pre id="ks-safe-error-text"></pre>
  </div>
</div>

<script>
(function () {
  window.addEventListener("error", function (e) {
    var box = document.getElementById("ks-safe-error");
    var text = document.getElementById("ks-safe-error-text");
    if (!box || !text) return;
    if (e.target && (e.target.tagName === "IMG" || e.target.tagName === "LINK")) return;
    var detail =
      "Message: " + (e.message || "Unknown error") + "\n" +
      "File: " + (e.filename || "unknown") + "\n" +
      "Line: " + (e.lineno || "?") + "\n" +
      "Column: " + (e.colno || "?") + "\n\n" +
      ((e.error && e.error.stack) || "");
    text.textContent = detail;
    box.style.display = "block";
  });
  window.addEventListener("unhandledrejection", function (e) {
    var box = document.getElementById("ks-safe-error");
    var text = document.getElementById("ks-safe-error-text");
    if (!box || !text) return;
    var r = e.reason;
    text.textContent = "Unhandled promise rejection:\n\n" +
      ((r && (r.stack || r.message)) || String(r));
    box.style.display = "block";
  });
})();
</script>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="./kalasutra-login-flow.js?v=20260919-safe1"></script>

<!-- IMPORTANT: keep the original Babel execution path.
     Do NOT wrap app.tsx in new Function/eval here. -->
<script type="text/babel" data-presets="react,typescript" src="/app.tsx?v=20260919-safe1"></script>
</body>
</html>
