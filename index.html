<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kala Sutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<div id="root"></div>

<!--
  KalaSutra runs React straight in the browser with no build step
  (no npm install, no Vite/webpack). React, ReactDOM and Babel are
  loaded from a public CDN here, and Babel compiles our TypeScript-
  flavoured JSX (app.tsx) on the fly in the browser. This needs an
  internet connection in the browser (same as the Google Fonts above)
  but needs NOTHING installed on your computer besides Node.js to run
  the backend server.
-->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="text/babel" data-presets="react,typescript" src="./app.tsx"></script>
<script>
(function () {
  if (!location.hostname.endsWith("github.io")) return;

  /* =========================
     KALASUTRA GITHUB PAGES FIX
     ========================= */

  /* Fix /assets/... image paths */
  function fixAssets() {
    document.querySelectorAll("img, video, source").forEach(function (el) {
      ["src", "poster"].forEach(function (attr) {
        var value = el.getAttribute(attr);

        if (value && value.indexOf("/assets/") === 0) {
          el.setAttribute(attr, "./public" + value);
        }
      });
    });
  }

  new MutationObserver(fixAssets).observe(document.documentElement, {
    childList: true,
    subtree: true
  });

  setTimeout(fixAssets, 500);
  setInterval(fixAssets, 2000);


  /* =========================
     DEMO API FOR GITHUB PAGES
     ========================= */

  var originalFetch = window.fetch;

  window.fetch = function (url, options) {

    var requestUrl = String(url);

    /* Normal internet requests work normally */
    if (!requestUrl.startsWith("/api")) {
      return originalFetch.apply(this, arguments);
    }

    var method =
      ((options && options.method) || "GET").toUpperCase();

    var path =
      requestUrl.replace("/api", "").split("?")[0];

    var body = {};

    try {
      body = JSON.parse(
        (options && options.body) || "{}"
      );
    } catch (e) {
      body = {};
    }

    function makeResponse(data, status) {
      return Promise.resolve(
        new Response(JSON.stringify(data), {
          status: status || 200,
          headers: {
            "Content-Type": "application/json"
          }
        })
      );
    }


    /* LOGIN / USER */
    if (path === "/users" && method === "POST") {

      var user = {
        id: "demo-user",
        name: body.name || "Guest",
        contact: body.contact || "",
        role: body.role || "buyer",
        profile:
          body.role === "artisan"
            ? {
                craft: "",
                location: "",
                bio: "",
                trustScore: 100
              }
            : {
                location: ""
              }
      };

      localStorage.setItem(
        "kalasutra_demo_user",
        JSON.stringify(user)
      );

      return makeResponse(user);
    }


    /* PRODUCTS */
    if (path === "/products" && method === "GET") {

      var products = JSON.parse(
        localStorage.getItem("kalasutra_products") || "[]"
      );

      return makeResponse(products);
    }


    /* ADD PRODUCT */
    if (path === "/products" && method === "POST") {

      var products = JSON.parse(
        localStorage.getItem("kalasutra_products") || "[]"
      );

      var product = {
        id: "demo-product-" + Date.now(),
        title: body.title || "Handmade Craft",
        description: body.description || "",
        price: Number(body.price) || 0,
        category: body.category || "Other",
        image: body.image || null,
        verificationStatus: "unverified",
        availability: true
      };

      products.unshift(product);

      localStorage.setItem(
        "kalasutra_products",
        JSON.stringify(products)
      );

      return makeResponse(product, 201);
    }


    /* WISHLIST */
    if (path === "/wishlist" && method === "GET") {
      return makeResponse([]);
    }

    if (path === "/wishlist" && method === "POST") {
      return makeResponse({ ok: true });
    }

    if (path === "/wishlist" && method === "DELETE") {
      return makeResponse({ ok: true });
    }


    /* CART */
    if (path === "/cart" && method === "GET") {
      return makeResponse([]);
    }

    if (path === "/cart" && method === "POST") {
      return makeResponse({ ok: true });
    }

    if (path === "/cart" && method === "DELETE") {
      return makeResponse({ ok: true });
    }


    /* ORDERS */
    if (path === "/orders" && method === "GET") {
      return makeResponse([]);
    }

    if (path === "/orders" && method === "POST") {

      var order = {
        id: "demo-order-" + Date.now(),
        buyerId: body.buyerId || "demo-user",
        amount: Number(body.amount) || 0,
        status: "placed",
        date: new Date().toISOString()
      };

      return makeResponse(order, 201);
    }


    /* AI PRODUCT VERIFICATION */
    if (path === "/scan" && method === "POST") {

      return makeResponse({
        status: "verified",
        confidence: 0.94,
        notes: [
          "No industrial symmetry detected",
          "No matches found in global databases",
          "Handmade verification demo completed"
        ],
        isDemo: true
      });
    }


    /* RISK CHECK */
    if (path === "/risk" && method === "POST") {

      return makeResponse({
        risk: "low",
        score: 0.08,
        isDemo: true
      });
    }

</body>
</html>
