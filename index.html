<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kala Sutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260919-working3">
<style>
#ks-load-error{display:none;position:fixed;inset:0;z-index:999999;background:#f4eeda;color:#241c1b;padding:20px;font-family:Arial,sans-serif;overflow:auto}
#ks-load-error .box{max-width:760px;margin:5vh auto;background:#fffaf3;border:1px solid #c9b8a5;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0002}
#ks-load-error h2{margin:0 0 8px;font-family:Georgia,serif}
#ks-load-error pre{white-space:pre-wrap;word-break:break-word;background:#f1e7d8;padding:12px;border-radius:10px;font-size:12px;line-height:1.45}
</style>
</head>
<body>
<div id="root"></div>
<div id="ks-load-error">
  <div class="box">
    <h2>KalaSutra loading error</h2>
    <p>The application could not start. Existing app files have not been changed.</p>
    <pre id="ks-load-error-text"></pre>
  </div>
</div>

<script>
(function(){
  function show(msg){
    var box=document.getElementById("ks-load-error");
    var out=document.getElementById("ks-load-error-text");
    if(box&&out){out.textContent=msg;box.style.display="block";}
  }
  window.__ksShowError=show;
  window.addEventListener("error",function(e){
    if(e.target && e.target.tagName && ["IMG","LINK"].indexOf(e.target.tagName)>=0) return;
    if(e.target && e.target.tagName==="SCRIPT"){
      show("Script resource failed to load.\n\nSource: "+(e.target.src||"unknown"));
      return;
    }
    var msg=(e.message||"Script error.");
    var detail=msg;
    if(e.filename) detail+="\nFile: "+e.filename;
    if(e.lineno) detail+="\nLine: "+e.lineno+"  Column: "+(e.colno||"?");
    if(e.error&&e.error.stack) detail+="\n\n"+e.error.stack;
    show(detail);
  });
  window.addEventListener("unhandledrejection",function(e){
    var r=e.reason;
    show("Unhandled promise rejection:\n\n"+((r&&(r.stack||r.message))||String(r)));
  });
})();
</script>

<!-- Use stable CDN builds without crossorigin masking Safari's error reporting. -->
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<!-- IMPORTANT: keep the existing app.tsx source untouched. -->
<script type="text/babel" data-presets="react,typescript" src="/app.tsx?v=20260919-working3"></script>

<!-- Login animation is additive; load it after the app so an animation error can
     never prevent the main React application from starting. -->
<script>
window.addEventListener("load",function(){
  var s=document.createElement("script");
  s.src="./kalasutra-login-flow.js?v=20260919-working3";
  s.onerror=function(){ console.warn("KalaSutra login enhancement could not load; main app remains active."); };
  document.body.appendChild(s);
});
</script>
</body>
</html>
