<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kala Sutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css?v=20260919-1948">
<style>
#ks-runtime-error{display:none;position:fixed;inset:0;z-index:99999;background:#f4eeda;color:#241c1b;padding:28px 20px;font-family:Arial,sans-serif}
#ks-runtime-error .box{max-width:520px;margin:10vh auto;background:#fffaf3;border:1px solid #c9b8a5;border-radius:18px;padding:22px;box-shadow:0 12px 40px #0002}
#ks-runtime-error h2{margin:0 0 10px;font-size:20px}
#ks-runtime-error p{font-size:13px;line-height:1.5}
#ks-runtime-error pre{white-space:pre-wrap;word-break:break-word;background:#f1e7d8;padding:12px;border-radius:10px;font-size:11px;max-height:42vh;overflow:auto}
</style>
</head>
<body>
<div id="root"></div>
<div id="ks-runtime-error"><div class="box">
<h2>KalaSutra loading error</h2>
<p>The page itself loaded, but the JavaScript app reported an error. This screen is only a diagnostic so we don't lose your existing design.</p>
<pre id="ks-runtime-error-text"></pre>
</div></div>
<script>
(function(){
  function show(e){
    try{
      var box=document.getElementById('ks-runtime-error');
      var text=document.getElementById('ks-runtime-error-text');
      if(!box||!text)return;
      var msg=(e&&e.error&&e.error.stack)||e&&e.reason&&e.reason.stack||e&&e.message||String(e);
      text.textContent=msg;
      box.style.display='block';
    }catch(_){}
  }
  window.addEventListener('error',show);
  window.addEventListener('unhandledrejection',show);
})();
</script>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="./kalasutra-login-flow.js?v=20260919-1948"></script>
<script type="text/babel" data-presets="react,typescript" src="/app.tsx?v=20260919-1948"></script>
</body>
</html>
