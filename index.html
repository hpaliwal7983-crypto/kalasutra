<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Karigar AI Talker — Standalone Test</title><link rel="stylesheet" href="../src/karigar-ai.css"><style>body{margin:0;background:#f8ead9;color:#351d16;font-family:system-ui;min-height:100vh}.demo{max-width:680px;margin:auto;padding:28px 18px 140px}.demo h1{font-family:Georgia,serif}.fake{height:180px;border-radius:28px;background:linear-gradient(135deg,#fff7eb,#ead0b6);display:grid;place-items:center;text-align:center;padding:20px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.buttons button{border:0;border-radius:999px;padding:12px 16px;background:#7b321c;color:#fff}.note{font-size:13px;color:#76594b;margin-top:14px}</style></head><body><main class="demo"><h1>Karigar AI — Voice-first test</h1><div class="fake"><div><b>Your KalaSutra app stays here.</b><br>Karigar AI floats above it and guides Add Product.</div></div><div class="buttons"><button id="start">Start Karigar AI</button><button id="add">Simulate “Add Product”</button></div><p class="note">This demo has no chat box. For production, pass your existing animated Karigar AI image through <code>avatarSrc</code> and connect the server adapter.</p></main><script src="../src/karigar-ai.js"></script><script>const ai=new KarigarAI({avatarSrc:'',mode:'compact',apiBase:'/api/karigar-ai',autoStart:false,onAction:e=>{console.log('[Karigar action]',e);if(e.action==='ADD_PRODUCT_START')document.querySelector('.fake').innerHTML='<b>Add Product screen opened.</b><br>AI remains active while you take the photo.';}});ai.mount(document.body);document.querySelector('#start').onclick=()=>ai.startConversation();document.querySelector('#add').onclick=()=>ai.handleUserText('Mujhe ek naya product add karna hai');</script></body></html>
