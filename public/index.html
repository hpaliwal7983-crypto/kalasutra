<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KalaSutra</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/styles.css?v=20260920-fix2">

  <style>
    #boot-error {
      display: none;
      position: fixed;
      inset: 20px;
      z-index: 999999;
      padding: 20px;
      border-radius: 16px;
      background: #fff4f0;
      color: #4b241b;
      font-family: Arial, sans-serif;
      white-space: pre-wrap;
      overflow: auto;
    }
  </style>
</head>

<body>

  <div id="root"></div>
  <div id="boot-error"></div>

  <script>
    window.addEventListener("error", function (e) {
      var box = document.getElementById("boot-error");
      if (box) {
        box.style.display = "block";
        box.textContent =
          "KALASUTRA START ERROR\n\n" +
          (e.message || "Unknown error") +
          "\n\nFile: " + (e.filename || "") +
          "\nLine: " + (e.lineno || "") +
          "\nColumn: " + (e.colno || "");
      }
    });

    window.addEventListener("unhandledrejection", function (e) {
      var box = document.getElementById("boot-error");
      if (box) {
        box.style.display = "block";
        box.textContent =
          "KALASUTRA PROMISE ERROR\n\n" +
          String(e.reason || "Unknown error");
      }
    });
  </script>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    (async function () {
      try {
        var response = await fetch("/app.tsx?v=20260920-fix2");

        if (!response.ok) {
          throw new Error("Could not load app.tsx. HTTP " + response.status);
        }

        var source = await response.text();

        var result = Babel.transform(source, {
          filename: "app.tsx",
          presets: ["react", "typescript"]
        });

        var script = document.createElement("script");
        script.text = result.code;
        document.body.appendChild(script);

      } catch (error) {
        var box = document.getElementById("boot-error");

        if (box) {
          box.style.display = "block";
          box.textContent =
            "KALASUTRA APP LOAD ERROR\n\n" +
            String(error && error.stack ? error.stack : error);
        }
      }
    })();
  </script>

</body>
</html>
